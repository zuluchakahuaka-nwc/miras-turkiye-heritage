name: miras
description: "MIRAS - offline cultural and historical guide to Turkiye heritage (RU/TR/EN)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_staggered_grid_view: ^0.7.0
  shared_preferences: ^2.3.2
  audioplayers: ^6.1.0
  file_picker: ^8.3.3
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Cormorant
      fonts:
        - asset: assets/fonts/Cormorant-600.ttf
          weight: 600
        - asset: assets/fonts/Cormorant-700.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
